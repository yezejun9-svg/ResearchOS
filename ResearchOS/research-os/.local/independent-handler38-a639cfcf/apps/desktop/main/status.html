<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>ResearchOS</title>
<style>body{font-family:system-ui,sans-serif;background:#faf9f6;color:#1d2b25;margin:0;padding:48px}
code{background:#eef2ee;padding:2px 6px;border-radius:4px}
h1{font-size:20px;font-weight:600}</style></head>
<body>
<h1>ResearchOS Desktop</h1>
<div id="s">正在发现宿主…</div>
<script>
window.researchos.hostStatus().then((s) => {
  document.getElementById('s').innerHTML =
    '宿主状态: <code>' + s.health + '</code><br>协议: <code>' + s.client_protocol +
    '</code><br>Electron: <code>' + s.electron + '</code><br>入口: <code>' + (s.url || '未发现') + '</code>';
});
</script>
</body></html>
