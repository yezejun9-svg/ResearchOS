<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>W05 model configuration UI fixture</title></head>
<body><div id="root"></div><script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import { NativeModelConfiguration } from '/src/workbench.jsx'
import '/src/style.css'
window.__calls = []
window.__host = { config_revision: 0, model_configurations: [] }
window.researchos = {
  desktop: { selectProject: async project_id => { window.__calls.push({ method: 'selectProject', project_id }); return { ok: true } } },
  v2: {
    'host.status': async payload => { window.__calls.push({ method: 'host.status', payload }); return { ok: true, completed: true, protocol_status: 'COMPLETED', result: structuredClone(window.__host) } },
    'host.configure': async payload => {
      window.__calls.push({ method: 'host.configure', payload: structuredClone(payload) })
      if (window.__reject) return { ok: false, protocol_status: 'REJECTED', error_code: 'CONFIGURATION_ENDPOINT', error: { message: 'address rejected' } }
      if (window.__ackOnce) { window.__ackOnce = false; return { ok: true, completed: false, protocol_status: 'ACKNOWLEDGED' } }
      const record = { ...payload, model_config_ref: 'mc-browser-fixture-1', verified_at: null }
      window.__host = { config_revision: payload.config_revision, model_configurations: [record] }
      return { ok: true, completed: true, protocol_status: 'COMPLETED', result: record }
    },
  },
}
createRoot(document.getElementById('root')).render(React.createElement(NativeModelConfiguration, { projectId: 'project-browser-fixture' }))
</script></body></html>
